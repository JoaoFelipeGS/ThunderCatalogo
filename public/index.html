<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Conheça as categorias Thunder Sthormy: camisetas oversized e peruanas, bermudas e kits. Escolha sua peça e peça pelo WhatsApp.">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <link rel="canonical" href="https://thundercatalogo.vercel.app/">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="pt_BR">
    <meta property="og:site_name" content="Thunder Sthormy">
    <meta property="og:title" content="Thunder Sthormy | Moda masculina com atitude">
    <meta property="og:description" content="Camisetas oversized e peruanas, bermudas e kits. Escolha sua peça no catálogo Thunder Sthormy e peça pelo WhatsApp.">
    <meta property="og:url" content="https://thundercatalogo.vercel.app/">
    <meta property="og:image" content="https://thundercatalogo.vercel.app/assets/banner-thunder-sthormy.webp">
    <meta property="og:image:alt" content="Banner da marca Thunder Sthormy Clothes">
    <meta property="og:image:width" content="2048">
    <meta property="og:image:height" content="768">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Thunder Sthormy | Moda masculina com atitude">
    <meta name="twitter:description" content="Camisetas oversized e peruanas, bermudas e kits. Escolha sua peça no catálogo Thunder Sthormy e peça pelo WhatsApp.">
    <meta name="twitter:image" content="https://thundercatalogo.vercel.app/assets/banner-thunder-sthormy.webp">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Thunder Sthormy">
    <title>Thunder Sthormy — Catálogo</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icons/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <link rel="sitemap" type="application/xml" href="/sitemap.xml">
    <link rel="stylesheet" href="/styles.css?v=32">
    <script src="/app.js?v=16" defer></script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://thundercatalogo.vercel.app/#organization",
            "name": "Thunder Sthormy",
            "url": "https://thundercatalogo.vercel.app/",
            "logo": "https://thundercatalogo.vercel.app/assets/logo-thunder.jpg?v=2",
            "image": "https://thundercatalogo.vercel.app/assets/banner-thunder-sthormy.webp",
            "description": "Thunder Sthormy Clothes — moda masculina com atitude."
          },
          {
            "@type": "WebSite",
            "@id": "https://thundercatalogo.vercel.app/#website",
            "name": "Thunder Sthormy",
            "url": "https://thundercatalogo.vercel.app/",
            "inLanguage": "pt-BR",
            "publisher": {
              "@id": "https://thundercatalogo.vercel.app/#organization"
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <header class="site-header">
      <button class="cart-toggle" id="cart-toggle" type="button" aria-label="Abrir carrinho, 0 itens" aria-controls="cart-dialog">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.2 11.1a2 2 0 0 0 2 1.6h8.5a2 2 0 0 0 1.9-1.4L21 9H6"></path><circle cx="10" cy="20" r="1"></circle><circle cx="18" cy="20" r="1"></circle></svg>
        <span>Carrinho</span>
        <span class="cart-count" id="cart-count">0</span>
      </button>
      <button class="install-toggle" id="install-toggle" type="button" hidden>Instalar app</button>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Ativar modo claro" aria-pressed="true">
        <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 15.4A8.5 8.5 0 0 1 8.6 3.8 8.5 8.5 0 1 0 20.2 15.4Z"></path></svg>
        <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path></svg>
      </button>
    </header>

    <section class="site-banner" aria-label="Thunder Sthormy, moda masculina com atitude">
      <img
        src="/assets/banner-thunder-sthormy.webp"
        alt="Logo Thunder Sthormy Clothes com o slogan Moda masculina com atitude"
        width="2048"
        height="768"
        fetchpriority="high"
      >
    </section>

    <main>
      <section class="collection section-shell" id="colecao" aria-labelledby="collection-title">
        <div class="section-heading">
          <div>
            <h1 id="collection-title">Escolha uma categoria</h1>
          </div>
          <p class="section-description" id="collection-description">Toque em uma categoria para ver as peças disponíveis.</p>
        </div>

        <div class="category-grid is-entering" id="category-grid" role="group" aria-label="Categorias de produtos">
          <a class="category-card" href="/categoria/bermudas" aria-label="Ver categoria Bermudas">
            <img src="/assets/categories/bermudas.webp" alt="Categoria Bermudas" width="1200" height="1200" fetchpriority="high">
          </a>
          <a class="category-card" href="/categoria/peruanas" aria-label="Ver categoria Peruanas">
            <img src="/assets/categories/peruanas.webp" alt="Categoria Camisetas Peruanas" width="1177" height="1200" loading="lazy">
          </a>
          <a class="category-card" href="/categoria/oversized" aria-label="Ver categoria Oversizeds">
            <img src="/assets/categories/oversized.webp" alt="Categoria Camisetas Oversizeds" width="1200" height="1200" loading="lazy">
          </a>
          <a class="category-card" href="/categoria/kits" aria-label="Ver categoria Kits">
            <img src="/assets/categories/kits.webp" alt="Categoria Kits" width="1200" height="1200" loading="lazy">
          </a>
        </div>

        <aside class="instagram-banner" aria-label="Instagram Thunder Sthormy">
          <div class="instagram-banner-copy">
            <p class="instagram-eyebrow">Acompanhe a loja</p>
            <h2>Siga no Instagram</h2>
            <p class="instagram-handle">@ThunderSthormy</p>
          </div>
          <a
            class="instagram-button"
            href="https://www.instagram.com/ThunderSthormy/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Seguir @ThunderSthormy no Instagram, abre em nova aba"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="18" cy="6" r="1" class="instagram-icon-dot"></circle></svg>
            <span>Seguir no Instagram</span>
            <span aria-hidden="true">↗</span>
          </a>
        </aside>

        <div class="catalog-controls" id="catalog-controls" hidden>
          <a class="category-back" id="category-back" href="/">← Todas as categorias</a>
          <div class="catalog-filter-row">
            <label class="search-box">
              <span class="sr-only">Buscar peça</span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 4.5 4.5"></path></svg>
              <input id="product-search" type="search" placeholder="Buscar peça..." autocomplete="off">
            </label>
            <label class="filter-box">
              <span>Tamanho</span>
              <select id="size-filter" aria-label="Filtrar por tamanho">
                <option value="">Todos</option>
              </select>
            </label>
            <label class="filter-box">
              <span>Cor</span>
              <select id="color-filter" aria-label="Filtrar por cor">
                <option value="">Todas</option>
              </select>
            </label>
          </div>
        </div>

        <div class="catalog-status" id="catalog-status" role="status" aria-live="polite" hidden></div>
        <div class="product-grid" id="product-grid" hidden></div>
        <div class="empty-state" id="empty-state" hidden>
          <span class="empty-icon" aria-hidden="true">⌕</span>
          <h3>Nenhuma peça por aqui.</h3>
          <p>Tente outro termo ou escolha uma categoria diferente.</p>
        </div>
      </section>

    </main>

    <footer class="site-footer">
      <a class="footer-brand" href="#" aria-label="Thunder Sthormy">
        <img src="/assets/logo-thunder.jpg?v=2" alt="">
      </a>
      <span class="footer-copy">© <span id="current-year"></span> THUNDER STHORMY</span>
    </footer>

    <dialog class="product-dialog" id="product-dialog" aria-labelledby="detail-title">
      <button class="dialog-close" type="button" data-close-dialog aria-label="Fechar detalhes">×</button>
      <div id="product-detail"></div>
    </dialog>

    <dialog class="cart-dialog" id="cart-dialog" aria-labelledby="cart-title">
      <button class="dialog-close" type="button" data-close-dialog aria-label="Fechar carrinho">×</button>
      <div class="cart-wrap">
        <p class="eyebrow eyebrow-dark"><span class="eyebrow-line"></span> Seu pedido</p>
        <h2 id="cart-title">Carrinho</h2>
        <div class="cart-items" id="cart-items"></div>
        <p class="cart-total" id="cart-total"></p>
        <p class="cart-hint" id="cart-hint" aria-live="polite"></p>
        <button class="button button-lime cart-checkout" id="cart-checkout" type="button" disabled>Finalizar pelo WhatsApp <span aria-hidden="true">↗</span></button>
      </div>
    </dialog>

    <dialog class="image-viewer-dialog" id="image-viewer-dialog" aria-label="Visualização ampliada da foto">
      <button class="viewer-close" type="button" data-close-dialog aria-label="Fechar foto">×</button>
      <button class="viewer-arrow viewer-previous" id="viewer-previous" type="button" aria-label="Foto anterior">‹</button>
      <img class="viewer-image" id="viewer-image" alt="">
      <button class="viewer-arrow viewer-next" id="viewer-next" type="button" aria-label="Próxima foto">›</button>
      <span class="viewer-count" id="viewer-count" aria-live="polite"></span>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
