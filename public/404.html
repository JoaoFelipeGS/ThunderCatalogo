<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <meta name="robots" content="noindex">
  <title>404 — Página não encontrada | THUNDER STHORMY</title>
  <link rel="stylesheet" href="/error-pages.css?v=1">

<body>
  <main class="error-page">
    <span class="corner corner--top" aria-hidden="true"></span>
    <span class="corner corner--bottom" aria-hidden="true"></span>

    <section class="error-content" aria-labelledby="error-title">
      <a class="brand" href="/" aria-label="THUNDER STHORMY — voltar à página inicial">
        <span class="brand-main">THUNDER<span class="bolt">ϟ</span></span>
        <span class="brand-sub">STHORMY</span>
        <span class="brand-clothes">— CLOTHES —</span>
      </a>

      <p class="error-code" aria-label="Erro 404">404</p>
      <h1 class="error-title" id="error-title">Página não encontrada</h1>
      <p class="error-description">
        A página que você está procurando não existe, foi removida
        ou o endereço pode estar incorreto.
      </p>

      <div class="error-actions">
        <a class="error-button" href="/">
          <span class="button-icon" aria-hidden="true">⌂</span>
          Voltar para a loja
          <span class="button-icon" aria-hidden="true">→</span>
        </a>
      </div>
    </section>

    <footer class="error-footer">
      <strong>Moda masculina com atitude</strong>
    </footer>
  </main>
</body>
</html>
